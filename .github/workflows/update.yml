name: Weekly Update

on:
  schedule:
    # 每周一 09:00 北京时间 = 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 推送更新后的 data/ 和 docs/

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up gh CLI auth
        run: echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync latest
        run: git pull --ff-only

      - name: Health check (refresh stars + check links)
        run: python3 scripts/check.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Discover candidates
        run: python3 scripts/discover.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Review candidates and update resources
        id: review
        run: |
          python3 scripts/review.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build site
        run: python3 scripts/build.py

      - name: Commit and push (if changed)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "update: ${DATE} 自动更新 — 刷新 star、检查链接、收录候选"
            git push
          fi
